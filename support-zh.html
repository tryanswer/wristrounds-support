<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>间歇计时支持</title><link rel="stylesheet" href="style.css"></head><body><header><nav aria-label="Navigation"><a href="index.html">间歇计时 · WristRounds</a><a href="support-en.html">English</a></nav></header><main><h1>间歇计时支持</h1><p>在手表上创建训练、预览各阶段并保存；已保存的训练可以重新打开编辑。</p><h2>反馈问题</h2><p>请提供手表型号、系统版本、应用版本、操作步骤，以及预期和实际结果。请勿发送健康记录或其他私人信息。</p><h2>训练提示</h2><p>可用提示取决于手表、已安装的系统声音、提示设置及系统权限。静音和勿扰可能影响输出。开始前请检查所选提示设置。</p><h2>联系</h2><p>技术问题请通过<a href="https://github.com/tryanswer/wristrounds-support/issues/new">支持入口</a>反馈。该入口为公开渠道，请勿填写个人信息、凭据或健康记录。</p><p><a href="privacy-zh.html">隐私政策</a> · <a href="support-en.html">English</a></p></main><footer>间歇计时 / WristRounds · 2026-10-10</footer></body></html>
